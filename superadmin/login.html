<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Admin — Mini Soccer 88 Alpha Sport</title>
<link rel="icon" href="../assets/logo/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Rubik', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #08090B 0%, #140004 50%, #1F0008 100%);
    position: relative;
    overflow: hidden;
  }

  /* Animated background orbs */
  body::before {
    content: '';
    position: fixed;
    top: -200px; left: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(215,25,38,0.3) 0%, transparent 70%);
    border-radius: 50%;
    animation: float1 8s ease-in-out infinite;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -150px; right: -150px;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(217,162,27,0.2) 0%, transparent 70%);
    border-radius: 50%;
    animation: float2 10s ease-in-out infinite;
  }
  @keyframes float1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(60px,40px)} }
  @keyframes float2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-40px,-60px)} }

  .login-card {
    position: relative;
    z-index: 10;
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 24px;
    padding: 48px 40px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 32px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(215,25,38,0.15);
    animation: slideUp 0.5s ease;
  }
  @keyframes slideUp {
    from { opacity:0; transform:translateY(30px); }
    to { opacity:1; transform:translateY(0); }
  }

  .login-logo {
    text-align: center;
    margin-bottom: 32px;
  }
  .login-logo-img-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 10px;
  }
  .login-logo img {
    display: block;
    height: 72px;
    width: auto;
    object-fit: contain;
    filter: drop-shadow(0 4px 16px rgba(0,0,0,0.5));
  }
  .login-logo h1 {
    font-size: 16px;
    font-weight: 600;
    color: rgba(255,255,255,0.85);
    letter-spacing: 0.04em;
    margin-top: 6px;
  }
  .login-logo h2 {
    font-size: 13px;
    font-weight: 400;
    color: rgba(255,255,255,0.35);
    margin-top: 4px;
  }

  .badge-admin {
    display: inline-block;
    background: linear-gradient(90deg, #D9A21B, #F3C644);
    color: #08090B;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 4px 14px;
    border-radius: 100px;
    margin-bottom: 10px;
  }

  .form-label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: rgba(255,255,255,0.55);
    margin-bottom: 8px;
    letter-spacing: 0.02em;
  }
  .form-group { margin-bottom: 20px; }  .input-wrap {
    position: relative;
  }
  .input-wrap .icon {
    position: absolute;
    left: 14px; top: 50%;
    transform: translateY(-50%);
    color: rgba(255,255,255,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .input-wrap .icon svg {
    width: 17px;
    height: 17px;
  }
  .form-input {
    width: 100%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 14px 44px 14px 44px;
    font-family: 'Rubik', sans-serif;
    font-size: 14px;
    color: #fff;
    transition: border-color 0.2s, background 0.2s;
    outline: none;
  }
  .form-input::placeholder { color: rgba(255,255,255,0.25); }
  .form-input:focus {
    border-color: rgba(215,25,38,0.7);
    background: rgba(255,255,255,0.09);
    box-shadow: 0 0 0 3px rgba(215,25,38,0.15);
  }

  .toggle-pass {
    position: absolute;
    right: 14px; top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: rgba(255,255,255,0.4);
    border: none; background: none;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: color 0.2s;
  }
  .toggle-pass svg {
    width: 18px;
    height: 18px;
  }
  .toggle-pass:hover { color: rgba(255,255,255,0.85); }

  .btn-login {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, #D71926 0%, #E82C3A 100%);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-family: 'Rubik', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
    box-shadow: 0 4px 20px rgba(215,25,38,0.4);
    margin-top: 8px;
    letter-spacing: 0.02em;
  }
  .btn-login:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(215,25,38,0.55);
  }
  .btn-login:active { transform: translateY(0); }
  .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .error-msg {
    display: none;
    background: rgba(217,162,27,0.15);
    border: 1px solid rgba(217,162,27,0.35);
    border-radius: 10px;
    padding: 12px 16px;
    color: #ff6b82;
    font-size: 13px;
    margin-bottom: 20px;
    text-align: center;
  }
  .error-msg.show { display: flex; align-items: center; justify-content: center; gap: 8px; animation: shake 0.4s ease; }
  @keyframes shake {
    0%,100%{transform:translateX(0)}
    20%,60%{transform:translateX(-6px)}
    40%,80%{transform:translateX(6px)}
  }

  .divider {
    border: none;
    border-top: 1px solid rgba(255,255,255,0.08);
    margin: 24px 0 16px;
  }
  .hint-text {
    font-size: 12px;
    color: rgba(255,255,255,0.3);
    text-align: center;
    line-height: 1.6;
  }
  .hint-text strong { color: rgba(255,255,255,0.55); }

  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: -3px;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="login-card">
  <div class="login-logo">
    <div class="login-logo-img-wrap">
      <img src="../assets/logo/ms88-logo-transparent.png" alt="Mini Soccer 88 Alpha Sport Pusdikif Logo">
    </div>
    <div class="badge-admin">Super Admin</div>
    <h1>Mini Soccer 88 Alpha Sport</h1>
    <h2>Pusdikif Kota Cimahi</h2>
  </div>

  <div class="error-msg" id="errorMsg">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="8" x2="12" y2="12"></line>
      <line x1="12" y1="16" x2="12.01" y2="16"></line>
    </svg>
    Username atau password salah!
  </div>

  <form id="loginForm" onsubmit="doLogin(event)">
    <div class="form-group">
      <label class="form-label">Username / Email</label>
      <div class="input-wrap">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </span>
        <input type="text" class="form-input" id="username" placeholder="Masukkan username" autocomplete="username" required>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Password</label>
      <div class="input-wrap">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </span>
        <input type="password" class="form-input" id="password" placeholder="Masukkan password" autocomplete="current-password" required>
        <button type="button" class="toggle-pass" id="btnTogglePass" onclick="togglePass()" title="Tampilkan/Sembunyikan password">
          <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>
    </div>

    <button type="submit" class="btn-login" id="btnLogin">Masuk ke Dashboard</button>
  </form>
</div>

<script>
  // Admin credentials (stored in localStorage so can be changed from dashboard)
  const STORED_CREDS = JSON.parse(localStorage.getItem('ms88_admin_creds') || 'null') || {
    username: 'admin',
    password: 'ms88admin2024'
  };

  // If already logged in, redirect to dashboard
  if (sessionStorage.getItem('ms88_admin_logged_in') === '1') {
    location.replace('/superadmin/');
  }

  function doLogin(e) {
    e.preventDefault();
    const user = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value;
    const btn = document.getElementById('btnLogin');
    const err = document.getElementById('errorMsg');

    // Loading state
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Memverifikasi...';
    err.classList.remove('show');

    setTimeout(() => {
      // Check credentials
      const creds = JSON.parse(localStorage.getItem('ms88_admin_creds') || 'null') || { username:'admin', password:'ms88admin2024' };
      if (user === creds.username && pass === creds.password) {
        sessionStorage.setItem('ms88_admin_logged_in', '1');
        sessionStorage.setItem('ms88_admin_user', user);
        btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;"><polyline points="20 6 9 17 4 12"></polyline></svg> Berhasil! Mengalihkan...';
        btn.style.background = 'linear-gradient(135deg,#1a6e3d,#22a05b)';
        setTimeout(() => location.replace('/superadmin/'), 800);
      } else {
        btn.disabled = false;
        btn.innerHTML = 'Masuk ke Dashboard';
        err.classList.add('show');
      }
    }, 900);
  }

  function togglePass() {
    const inp = document.getElementById('password');
    const eye = document.getElementById('eyeIcon');
    if (inp.type === 'password') {
      inp.type = 'text';
      eye.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
    } else {
      inp.type = 'password';
      eye.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
    }
  }
</script>
</body>
</html>
