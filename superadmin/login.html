<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Admin — Mini Soccer 88 Alpha Sport</title>
<link rel="icon" href="../assets/logos/new-Favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Rubik', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0d0d0d 0%, #1a0008 50%, #2d0010 100%);
    position: relative;
    overflow: hidden;
  }

  /* Animated background orbs */
  body::before {
    content: '';
    position: fixed;
    top: -200px; left: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(158,6,32,0.3) 0%, transparent 70%);
    border-radius: 50%;
    animation: float1 8s ease-in-out infinite;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -150px; right: -150px;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(220,38,67,0.2) 0%, transparent 70%);
    border-radius: 50%;
    animation: float2 10s ease-in-out infinite;
  }
  @keyframes float1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(60px,40px)} }
  @keyframes float2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-40px,-60px)} }

  .login-card {
    position: relative;
    z-index: 10;
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 24px;
    padding: 48px 40px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 32px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(158,6,32,0.15);
    animation: slideUp 0.5s ease;
  }
  @keyframes slideUp {
    from { opacity:0; transform:translateY(30px); }
    to { opacity:1; transform:translateY(0); }
  }

  .login-logo {
    text-align: center;
    margin-bottom: 32px;
  }
  .login-logo img {
    height: 44px;
    filter: brightness(0) invert(1);
    margin-bottom: 12px;
  }
  .login-logo h1 {
    font-size: 16px;
    font-weight: 500;
    color: rgba(255,255,255,0.6);
    letter-spacing: 0.04em;
  }
  .login-logo h2 {
    font-size: 13px;
    font-weight: 400;
    color: rgba(255,255,255,0.35);
    margin-top: 4px;
  }

  .badge-admin {
    display: inline-block;
    background: linear-gradient(90deg, #9E0620, #dc2643);
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 4px 14px;
    border-radius: 100px;
    margin-bottom: 8px;
  }

  .form-label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: rgba(255,255,255,0.55);
    margin-bottom: 8px;
    letter-spacing: 0.02em;
  }
  .form-group { margin-bottom: 20px; }

  .input-wrap {
    position: relative;
  }
  .input-wrap .icon {
    position: absolute;
    left: 14px; top: 50%;
    transform: translateY(-50%);
    color: rgba(255,255,255,0.35);
    font-size: 16px;
    pointer-events: none;
  }
  .form-input {
    width: 100%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 14px 14px 14px 44px;
    font-family: 'Rubik', sans-serif;
    font-size: 14px;
    color: #fff;
    transition: border-color 0.2s, background 0.2s;
    outline: none;
  }
  .form-input::placeholder { color: rgba(255,255,255,0.25); }
  .form-input:focus {
    border-color: rgba(158,6,32,0.7);
    background: rgba(255,255,255,0.09);
    box-shadow: 0 0 0 3px rgba(158,6,32,0.15);
  }

  .toggle-pass {
    position: absolute;
    right: 14px; top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: rgba(255,255,255,0.35);
    font-size: 15px;
    border: none; background: none;
    transition: color 0.2s;
  }
  .toggle-pass:hover { color: rgba(255,255,255,0.7); }

  .btn-login {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, #9E0620 0%, #dc2643 100%);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-family: 'Rubik', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
    box-shadow: 0 4px 20px rgba(158,6,32,0.4);
    margin-top: 8px;
    letter-spacing: 0.02em;
  }
  .btn-login:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(158,6,32,0.55);
  }
  .btn-login:active { transform: translateY(0); }
  .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .error-msg {
    display: none;
    background: rgba(220,38,67,0.15);
    border: 1px solid rgba(220,38,67,0.35);
    border-radius: 10px;
    padding: 12px 16px;
    color: #ff6b82;
    font-size: 13px;
    margin-bottom: 20px;
    text-align: center;
  }
  .error-msg.show { display: block; animation: shake 0.4s ease; }
  @keyframes shake {
    0%,100%{transform:translateX(0)}
    20%,60%{transform:translateX(-6px)}
    40%,80%{transform:translateX(6px)}
  }

  .divider {
    border: none;
    border-top: 1px solid rgba(255,255,255,0.07);
    margin: 24px 0 20px;
  }
  .hint-text {
    text-align: center;
    font-size: 12px;
    color: rgba(255,255,255,0.25);
  }
  .hint-text strong { color: rgba(255,255,255,0.45); }

  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="login-card">
  <div class="login-logo">
    <img src="../assets/logo/new-new-logo.svg" alt="Logo" onerror="this.style.display='none'">
    <div class="badge-admin">Super Admin</div>
    <h1>Mini Soccer 88 Alpha Sport</h1>
    <h2>Pusdikif Kota Cimahi</h2>
  </div>

  <div class="error-msg" id="errorMsg">⚠ Username atau password salah!</div>

  <form id="loginForm" onsubmit="doLogin(event)">
    <div class="form-group">
      <label class="form-label">Username / Email</label>
      <div class="input-wrap">
        <span class="icon">👤</span>
        <input type="text" class="form-input" id="username" placeholder="Masukkan username" autocomplete="username" required>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Password</label>
      <div class="input-wrap">
        <span class="icon">🔒</span>
        <input type="password" class="form-input" id="password" placeholder="Masukkan password" autocomplete="current-password" required>
        <button type="button" class="toggle-pass" onclick="togglePass()">👁</button>
      </div>
    </div>

    <button type="submit" class="btn-login" id="btnLogin">Masuk ke Dashboard</button>
  </form>

  <hr class="divider">
  <p class="hint-text">
    Default: <strong>admin</strong> / <strong>ms88admin2024</strong>
  </p>
</div>

<script>
  // Admin credentials (stored in localStorage so can be changed from dashboard)
  const STORED_CREDS = JSON.parse(localStorage.getItem('ms88_admin_creds') || 'null') || {
    username: 'admin',
    password: 'ms88admin2024'
  };

  // If already logged in, redirect to dashboard
  if (sessionStorage.getItem('ms88_admin_logged_in') === '1') {
    location.replace('./');
  }

  function doLogin(e) {
    e.preventDefault();
    const user = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value;
    const btn = document.getElementById('btnLogin');
    const err = document.getElementById('errorMsg');

    // Loading state
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Memverifikasi...';
    err.classList.remove('show');

    setTimeout(() => {
      // Check credentials
      const creds = JSON.parse(localStorage.getItem('ms88_admin_creds') || 'null') || { username:'admin', password:'ms88admin2024' };
      if (user === creds.username && pass === creds.password) {
        sessionStorage.setItem('ms88_admin_logged_in', '1');
        sessionStorage.setItem('ms88_admin_user', user);
        btn.innerHTML = '✓ Berhasil! Mengalihkan...';
        btn.style.background = 'linear-gradient(135deg,#1a6e3d,#22a05b)';
        setTimeout(() => location.replace('./'), 800);
      } else {
        btn.disabled = false;
        btn.innerHTML = 'Masuk ke Dashboard';
        err.classList.add('show');
      }
    }, 900);
  }

  function togglePass() {
    const inp = document.getElementById('password');
    inp.type = inp.type === 'password' ? 'text' : 'password';
  }
</script>
</body>
</html>
