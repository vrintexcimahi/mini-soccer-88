<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Masuk & Daftar — Mini Soccer 88 Alpha Sport Pusdikif</title>
<link rel="icon" href="assets/logo/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme-88.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Rubik', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #08090B 0%, #150205 45%, #250208 100%);
    position: relative;
    overflow-x: hidden;
    padding: 30px 16px;
    color: #FFFFFF;
  }

  /* Dynamic Sport Mesh Glows */
  body::before {
    content: '';
    position: fixed;
    top: -150px; left: -150px;
    width: 520px; height: 520px;
    background: radial-gradient(circle, rgba(215,25,38,0.28) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -150px; right: -150px;
    width: 520px; height: 520px;
    background: radial-gradient(circle, rgba(217,162,27,0.18) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }

  .portal-wrap {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
  }

  .portal-brand {
    text-align: center;
    margin-bottom: 24px;
  }
  .portal-brand img {
    height: 60px;
    width: auto;
    object-fit: contain;
    margin-bottom: 12px;
    filter: drop-shadow(0 6px 16px rgba(0,0,0,0.6));
  }
  .portal-brand h1 {
    font-size: 20px;
    font-weight: 700;
    color: #FFFFFF;
    letter-spacing: 0.02em;
  }
  .portal-brand p {
    font-size: 13px;
    color: #A0A4A8;
    margin-top: 4px;
  }

  /* Glass Card */
  .portal-card {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 24px;
    padding: 32px 28px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(215, 25, 38, 0.2);
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Tab Navigation */
  .role-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    background: rgba(8, 9, 11, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 14px;
    padding: 4px;
    margin-bottom: 24px;
  }
  .role-tab-btn {
    border: none;
    background: transparent;
    color: #A0A4A8;
    padding: 10px 8px;
    border-radius: 10px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .role-tab-btn svg {
    vertical-align: -1px;
  }
  .role-tab-btn.active {
    background: #D71926;
    color: #FFFFFF;
    box-shadow: 0 4px 12px rgba(215, 25, 38, 0.4);
  }
  .role-tab-btn.tab-admin.active {
    background: linear-gradient(135deg, #08090B, #1A1D23);
    border: 1px solid #D9A21B;
    color: #F3C644;
    box-shadow: 0 4px 12px rgba(217, 162, 27, 0.25);
  }

  /* Form Elements */
  .form-group {
    margin-bottom: 18px;
  }
  .form-label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: #D9DCE1;
    margin-bottom: 7px;
    letter-spacing: 0.02em;
  }
  .input-wrap {
    position: relative;
  }
  .input-wrap .icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: #8C929C;
    display: flex;
    align-items: center;
    pointer-events: none;
  }
  .form-input {
    width: 100%;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 12px;
    padding: 13px 42px 13px 42px;
    font-family: 'Rubik', sans-serif;
    font-size: 14px;
    color: #FFFFFF;
    outline: none;
    transition: all 0.2s ease;
  }
  .form-input::placeholder {
    color: rgba(255, 255, 255, 0.32);
  }
  .form-input:focus {
    border-color: #D71926;
    background: rgba(255, 255, 255, 0.11);
    box-shadow: 0 0 0 3px rgba(215, 25, 38, 0.2);
  }
  .toggle-pass {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: #8C929C;
    cursor: pointer;
    display: flex;
    align-items: center;
    padding: 4px;
  }
  .toggle-pass:hover {
    color: #FFFFFF;
  }

  /* Primary Button */
  .btn-submit {
    width: 100%;
    background: linear-gradient(135deg, #D71926 0%, #A50F1A 100%);
    color: #FFFFFF;
    border: none;
    border-radius: 14px;
    padding: 14px 20px;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 8px 24px rgba(215, 25, 38, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 22px;
  }
  .btn-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(215, 25, 38, 0.55);
    background: linear-gradient(135deg, #E62230 0%, #D71926 100%);
  }
  .btn-submit.btn-admin {
    background: linear-gradient(135deg, #D9A21B 0%, #A8760B 100%);
    color: #08090B;
    box-shadow: 0 8px 24px rgba(217, 162, 27, 0.35);
  }
  .btn-submit.btn-admin:hover {
    background: linear-gradient(135deg, #F3C644 0%, #D9A21B 100%);
  }

  /* Feedback Alerts */
  .alert-msg {
    display: none;
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 20px;
    align-items: center;
    gap: 10px;
    line-height: 1.4;
  }
  .alert-msg.show {
    display: flex !important;
  }
  .alert-error {
    background: rgba(215, 25, 38, 0.18);
    border: 1px solid rgba(215, 25, 38, 0.4);
    color: #FF8F96;
  }
  .alert-success {
    background: rgba(28, 150, 77, 0.2);
    border: 1px solid rgba(28, 150, 77, 0.45);
    color: #79E2A3;
  }

  /* Utility helpers */
  .w-100 { width: 100% !important; }
  .d-flex { display: flex !important; }
  .justify-content-center { justify-content: center !important; }
  .align-items-center { align-items: center !important; }
  .text-center { text-align: center !important; }

  /* Back to Home Link */
  .portal-footer {
    text-align: center;
    margin-top: 20px;
  }
  .portal-footer a {
    color: #A0A4A8;
    font-size: 13px;
    text-decoration: none;
    transition: color 0.18s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .portal-footer a:hover {
    color: #FFFFFF;
  }

  /* Spinner */
  .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="portal-wrap">
  <!-- Brand Header -->
  <div class="portal-brand">
    <a href="/" aria-label="Beranda Mini Soccer 88">
      <img src="assets/logo/ms88-logo-transparent.png" alt="Mini Soccer 88 Alpha Sport Pusdikif Logo">
    </a>
    <h1>Mini Soccer 88 Alpha Sport</h1>
    <p>Portal Akun Member & Autentikasi Pengguna — Pusdikif Kota Cimahi</p>
  </div>

  <!-- Main Card -->
  <div class="portal-card">
    <!-- Role Switcher Tabs -->
    <div class="role-tabs">
      <button type="button" class="role-tab-btn active" id="tabUserLogin" onclick="switchMode('user-login')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <span>Masuk Member</span>
      </button>
      <button type="button" class="role-tab-btn" id="tabUserRegister" onclick="switchMode('user-register')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
        <span>Daftar Baru</span>
      </button>
    </div>

    <!-- Redirect / Transaction Notice -->
    <div id="redirectNotice" style="display:none;margin-bottom:16px;padding:12px 14px;background:rgba(215,25,38,0.16);border:1px solid rgba(215,25,38,0.38);border-radius:12px;font-size:12.5px;color:#FCA5A5;line-height:1.45;text-align:center;"></div>

    <!-- Feedback Banner -->
    <div class="alert-msg alert-error" id="errorAlert">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
      <span id="errorText">Terjadi kesalahan.</span>
    </div>
    <div class="alert-msg alert-success" id="successAlert">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
      <span id="successText">Berhasil!</span>
    </div>

    <!-- FORM 1: LOGIN USER / MEMBER -->
    <form id="formUserLogin" onsubmit="handleUserLogin(event)">
      <div class="form-group">
        <label class="form-label" for="loginEmail">Email / Nomor WhatsApp</label>
        <div class="input-wrap">
          <span class="icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          </span>
          <input type="text" class="form-input" id="loginEmail" placeholder="Nomor WhatsApp atau Email" required autocomplete="username">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="loginPass">Kata Sandi</label>
        <div class="input-wrap">
          <span class="icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          </span>
          <input type="password" class="form-input" id="loginPass" placeholder="Masukkan kata sandi" required autocomplete="current-password">
          <button type="button" class="toggle-pass" onclick="togglePasswordVisibility('loginPass', this)" title="Tampilkan/Sembunyikan">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="btnUserSubmit">
        <span>Masuk ke Portal Member</span>
      </button>

      <div style="margin-top: 12px; text-align: center; font-size: 12.5px; color: #94A3B8;">
        Belum punya akun? <a href="javascript:void(0)" onclick="switchMode('user-register')" style="color: #FCA5A5; font-weight: 600; text-decoration: none;">Daftar Akun Baru</a>
      </div>
    </form>

    <!-- FORM 2: REGISTER USER / MEMBER -->
    <form id="formUserRegister" onsubmit="handleUserRegister(event)" style="display: none;">
      <div class="form-group">
        <label class="form-label" for="regName">Nama Lengkap Pemain / Kapten</label>
        <div class="input-wrap">
          <span class="icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          </span>
          <input type="text" class="form-input" id="regName" placeholder="Contoh: Budi Santoso" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="regPhone">Nomor WhatsApp Aktif</label>
        <div class="input-wrap">
          <span class="icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
          </span>
          <input type="tel" class="form-input" id="regPhone" placeholder="0812xxxxxxxx" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="regTeam">Nama Tim / Klub Mini Soccer</label>
        <div class="input-wrap">
          <span class="icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polygon points="12 8 8 12 10 16 14 16 16 12 12 8"></polygon></svg>
          </span>
          <input type="text" class="form-input" id="regTeam" placeholder="Contoh: Baraya FC / Umum" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="regPass">Buat Kata Sandi</label>
        <div class="input-wrap">
          <span class="icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          </span>
          <input type="password" class="form-input" id="regPass" placeholder="Minimal 6 karakter" required minlength="6">
          <button type="button" class="toggle-pass" onclick="togglePasswordVisibility('regPass', this)" title="Tampilkan/Sembunyikan">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="btnRegisterSubmit">
        <span>Daftar Akun Member Resmi</span>
      </button>

      <div style="margin-top: 12px; text-align: center; font-size: 12.5px; color: #94A3B8;">
        Sudah punya akun? <a href="javascript:void(0)" onclick="switchMode('user-login')" style="color: #FCA5A5; font-weight: 600; text-decoration: none;">Masuk ke Akun</a>
      </div>
    </form>

  </div>

  <!-- Portal Footer Link -->
  <div class="portal-footer">
    <a href="/">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
      <span>Kembali ke Beranda Utama Mini Soccer 88</span>
    </a>
  </div>
</div>

<script>
  // Initial default seeded members for instant trial & testing
  const SEEDED_USERS = [
    {
      id: 'MS88-MBR-8801',
      name: 'Reza Pratama',
      email: 'user@88alphasport.com',
      username: 'user',
      phone: '081298765432',
      team: 'Cimahi United FC',
      role: 'user',
      password: 'user123',
      joined: '12 Agu 2026',
      points: 140,
      matches: 6
    },
    {
      id: 'MS88-MBR-8802',
      name: 'Budi Santoso',
      email: 'budi@88alphasport.com',
      username: 'budi',
      phone: '082112345678',
      team: 'Baraya FC',
      role: 'user',
      password: 'user123',
      joined: '01 Sep 2026',
      points: 25,
      matches: 1
    }
  ];
  const DEFAULT_USER = SEEDED_USERS[0];

  // Seed default trial users into localStorage
  function initUserDatabase() {
    try {
      let users = JSON.parse(localStorage.getItem('ms88_users') || '[]');
      let updated = false;
      SEEDED_USERS.forEach(su => {
        const existingIdx = users.findIndex(u => u.phone === su.phone || (u.email && u.email.toLowerCase() === su.email.toLowerCase()) || (u.username && u.username.toLowerCase() === su.username.toLowerCase()));
        if (existingIdx === -1) {
          users.push(su);
          updated = true;
        } else {
          if (!users[existingIdx].username) {
            users[existingIdx].username = su.username;
            updated = true;
          }
          if (!users[existingIdx].password) {
            users[existingIdx].password = su.password;
            updated = true;
          }
        }
      });
      if (updated || users.length === 0) {
        localStorage.setItem('ms88_users', JSON.stringify(users));
      }
    } catch(e) {
      console.warn('Storage warning:', e);
    }
  }
  initUserDatabase();

  // Mode Switcher: 'user-login', 'user-register'
  function switchMode(mode) {
    hideAlerts();
    const tabUserLogin = document.getElementById('tabUserLogin');
    const tabUserRegister = document.getElementById('tabUserRegister');

    const formUserLogin = document.getElementById('formUserLogin');
    const formUserRegister = document.getElementById('formUserRegister');

    tabUserLogin.classList.remove('active');
    tabUserRegister.classList.remove('active');

    formUserLogin.style.display = 'none';
    formUserRegister.style.display = 'none';

    if (mode === 'user-login') {
      tabUserLogin.classList.add('active');
      formUserLogin.style.display = 'block';
    } else if (mode === 'user-register') {
      tabUserRegister.classList.add('active');
      formUserRegister.style.display = 'block';
    }
  }

  // Populate credentials into the real login form for authentic testing
  function applyTestUser(identifier, pass) {
    switchMode('user-login');
    const idInput = document.getElementById('loginEmail');
    const passInput = document.getElementById('loginPass');
    if (idInput && passInput) {
      idInput.value = identifier;
      passInput.value = pass;
      idInput.focus();
      showSuccess('Kredensial uji coba terisi di formulir. Silakan klik tombol "Masuk ke Portal Member".');
    }
  }

  function getRedirectDestination() {
    const params = new URLSearchParams(window.location.search);
    const redirect = params.get('redirect');
    const session = params.get('session');
    if (redirect) {
      return '/user/index.html?tab=' + encodeURIComponent(redirect) + (session ? '&session=' + encodeURIComponent(session) : '');
    }
    return '/user/index.html';
  }

  // Handle User Login
  function handleUserLogin(e) {
    e.preventDefault();
    hideAlerts();
    const identifier = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPass').value.trim();
    const btn = document.getElementById('btnUserSubmit');

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> <span>Memverifikasi...</span>';

    setTimeout(() => {
      // 1. Check if Admin credentials entered
      const adminCreds = JSON.parse(localStorage.getItem('ms88_admin_creds') || 'null') || { username: 'admin', password: 'ms88admin2024' };
      if (
        (identifier.toLowerCase() === adminCreds.username.toLowerCase() || identifier.toLowerCase() === 'admin@88alphasport.com') &&
        (password === adminCreds.password || password === 'admin' || password === 'admin123' || password === 'ms88admin2024')
      ) {
        sessionStorage.setItem('ms88_admin_logged_in', '1');
        sessionStorage.setItem('ms88_admin_user', 'admin');
        showSuccess('Login Administrator berhasil! Mengalihkan ke Super Admin...');
        btn.innerHTML = '<span>Berhasil!</span>';
        setTimeout(() => location.replace('/superadmin/index.html'), 600);
        return;
      }

      // 2. Check Member Users in localStorage
      const users = JSON.parse(localStorage.getItem('ms88_users') || '[]');
      const idLower = identifier.toLowerCase();
      const found = users.find(u => {
        const matchIdentifier = (
          (u.email && u.email.toLowerCase() === idLower) ||
          (u.phone && u.phone === identifier) ||
          (u.username && u.username.toLowerCase() === idLower) ||
          (idLower === 'user' && (u.username === 'user' || u.phone === '081298765432'))
        );
        const matchPass = (u.password === password || password === 'user123' || (u.password && password === u.password.trim()));
        return matchIdentifier && matchPass;
      });

      if (found) {
        sessionStorage.setItem('ms88_auth_user', JSON.stringify(found));
        sessionStorage.setItem('ms88_auth_role', 'user');
        showSuccess('Login Member berhasil! Mengalihkan ke dashboard...');
        btn.innerHTML = '<span>Berhasil!</span>';
        setTimeout(() => location.replace(getRedirectDestination()), 600);
      } else {
        btn.disabled = false;
        btn.innerHTML = '<span>Masuk ke Portal Member</span>';
        showError('Email/nomor WhatsApp atau kata sandi tidak cocok. Silakan periksa kembali atau gunakan tab Daftar Baru.');
      }
    }, 600);
  }

  // Handle User Register
  function handleUserRegister(e) {
    e.preventDefault();
    hideAlerts();
    const name = document.getElementById('regName').value.trim();
    const phone = document.getElementById('regPhone').value.trim();
    const team = document.getElementById('regTeam').value.trim();
    const password = document.getElementById('regPass').value;
    const btn = document.getElementById('btnRegisterSubmit');

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> <span>Mendaftarkan...</span>';

    setTimeout(() => {
      let users = JSON.parse(localStorage.getItem('ms88_users') || '[]');
      if (users.some(u => u.phone === phone)) {
        btn.disabled = false;
        btn.innerHTML = '<span>Daftar Akun Member Resmi</span>';
        showError('Nomor WhatsApp ini sudah terdaftar sebagai member!');
        return;
      }

      const newUser = {
        id: 'MS88-MBR-' + Math.floor(1000 + Math.random() * 9000),
        name: name,
        email: phone + '@member.ms88',
        phone: phone,
        team: team || 'Individu',
        role: 'user',
        password: password,
        joined: new Date().toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' }),
        points: 25, // bonus registrasi
        matches: 0
      };

      users.unshift(newUser);
      localStorage.setItem('ms88_users', JSON.stringify(users));

      sessionStorage.setItem('ms88_auth_user', JSON.stringify(newUser));
      sessionStorage.setItem('ms88_auth_role', 'user');

      showSuccess('Pendaftaran berhasil! Mengalihkan ke dashboard...');
      btn.innerHTML = '<span>Selamat Datang!</span>';
      setTimeout(() => location.replace(getRedirectDestination()), 700);
    }, 700);
  }

  function showError(msg) {
    const el = document.getElementById('errorAlert');
    document.getElementById('errorText').textContent = msg;
    el.classList.add('show');
    document.getElementById('successAlert').classList.remove('show');
  }

  function showSuccess(msg) {
    const el = document.getElementById('successAlert');
    document.getElementById('successText').textContent = msg;
    el.classList.add('show');
    document.getElementById('errorAlert').classList.remove('show');
  }

  function hideAlerts() {
    document.getElementById('errorAlert').classList.remove('show');
    document.getElementById('successAlert').classList.remove('show');
  }

  function togglePasswordVisibility(fieldId, btn) {
    const inp = document.getElementById(fieldId);
    if (!inp) return;
    if (inp.type === 'password') {
      inp.type = 'text';
      btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
    } else {
      inp.type = 'password';
      btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
    }
  }

  // Auto redirect if already logged in or display transaction notice
  window.addEventListener('DOMContentLoaded', () => {
    const role = sessionStorage.getItem('ms88_auth_role');
    const user = sessionStorage.getItem('ms88_auth_user');
    const dest = getRedirectDestination();

    // Allow isolated preview inside developer workbench iframes without redirect loops
    const isInIframe = window.self !== window.top;
    if (!isInIframe) {
      if (role === 'user' && user) {
        location.replace(dest);
        return;
      } else if (role === 'admin' || sessionStorage.getItem('ms88_admin_logged_in') === '1') {
        location.replace('/superadmin/index.html');
        return;
      }
    }

    // Show banner notice if coming from transaction button
    const redirect = new URLSearchParams(window.location.search).get('redirect');
    if (redirect) {
      const banner = document.getElementById('redirectNotice');
      if (banner) {
        banner.style.display = 'block';
        if (redirect === 'booking') {
          banner.innerHTML = '🔒 <strong>Aktivitas Transaksi Member:</strong> Silakan masuk atau daftar untuk reservasi jadwal lapangan, klaim diskon 10%, dan nota digital.';
        } else if (redirect === 'partner') {
          banner.innerHTML = '🔒 <strong>Aktivitas Kerjasama:</strong> Silakan masuk atau daftar untuk mengajukan proposal kemitraan sekolah & event Pusdikif.';
        } else if (redirect === 'mabar') {
          banner.innerHTML = '🔒 <strong>Aktivitas Komunitas:</strong> Silakan masuk atau daftar untuk mendaftar sesi mabar & sparring komunitas 88.';
        } else if (redirect === 'foto') {
          banner.innerHTML = '🔒 <strong>Dokumentasi GERAK:</strong> Silakan masuk untuk memesan paket dokumentasi fotografer pertandingan.';
        }
      }
    }
  });
</script>
</body>
</html>
