<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mode Offline — Mini Soccer 88 Alpha Sport Cimahi</title>
  <link rel="icon" type="image/png" href="assets/icons/icon-96x96.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FFFFFF">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme-88.css">
  <style>
    :root {
      --as88-white: #FFFFFF;
      --as88-sport-red: #D71926;
      --as88-sport-red-dark: #B5141F;
      --as88-silver: #D9DCE1;
      --as88-silver-bg: #F4F5F7;
      --as88-black: #08090B;
      --as88-gold: #D9A21B;
      --as88-muted: #5A606A;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Rubik', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at 50% 10%, #FFFFFF 0%, #F4F5F7 100%);
      color: var(--as88-black);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .offline-card {
      background: #FFFFFF;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid var(--as88-silver);
      box-shadow: 0 20px 50px rgba(8, 9, 11, 0.08), 0 0 25px rgba(217, 162, 27, 0.1);
      border-radius: 24px;
      padding: 40px 28px;
      max-width: 480px;
      width: 100%;
    }
    .icon-wrap {
      width: 90px;
      height: 90px;
      margin: 0 auto 24px;
      background: rgba(215, 25, 38, 0.08);
      border: 2px dashed var(--as88-gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      animation: pulse-slow 2.4s infinite ease-in-out;
    }
    @keyframes pulse-slow {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.05); opacity: 1; }
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 12px;
      color: var(--as88-black);
    }
    h1 span {
      color: var(--as88-sport-red);
    }
    p {
      color: var(--as88-muted);
      font-size: 14.5px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .cached-pages {
      background: var(--as88-silver-bg);
      border: 1px solid var(--as88-silver);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 24px;
      text-align: left;
    }
    .cached-pages h3 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--as88-gold);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
    }
    .page-links {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .page-link-btn {
      display: block;
      background: #FFFFFF;
      border: 1px solid var(--as88-silver);
      color: var(--as88-black);
      text-decoration: none;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      transition: all 0.2s ease;
    }
    .page-link-btn:hover {
      background: rgba(215, 25, 38, 0.06);
      border-color: var(--as88-sport-red);
      color: var(--as88-sport-red);
      transform: translateY(-1px);
    }
    .btn-retry {
      background: linear-gradient(135deg, var(--as88-sport-red) 0%, var(--as88-sport-red-dark) 100%);
      color: #FFFFFF;
      font-weight: 700;
      font-size: 15px;
      border: none;
      padding: 14px 28px;
      border-radius: 100px;
      cursor: pointer;
      width: 100%;
      margin-bottom: 14px;
      transition: all 0.2s ease;
      box-shadow: 0 6px 20px rgba(215, 25, 38, 0.3);
    }
    .btn-retry:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(215, 25, 38, 0.45);
      background: linear-gradient(135deg, #E82C3A 0%, var(--as88-sport-red) 100%);
    }
    .admin-wa {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--as88-black);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 600;
      margin-top: 8px;
      transition: color 0.2s;
    }
    .admin-wa:hover {
      color: var(--as88-sport-red);
    }
  </style>
</head>
<body>

  </div>
</body>
</html>
