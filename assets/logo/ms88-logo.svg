<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 54" fill="none" width="260" height="54">
  <!-- Shield / Crest Badge -->
  <g transform="translate(6, 3)">
    <!-- Outer Shield with Glow -->
    <path d="M24 2 L42 8 C42 28 32 42 24 47 C16 42 6 28 6 8 Z" fill="url(#crestGrad)" stroke="#F59E0B" stroke-width="1.8" filter="url(#dropShadow)" />
    <!-- Inner Shield Accent -->
    <path d="M24 6 L38 11 C38 27 30 38 24 43 C18 38 10 27 10 11 Z" fill="#042F2E" stroke="#10B981" stroke-width="0.8" opacity="0.85" />
    
    <!-- Soccer Ball Accent -->
    <circle cx="24" cy="23" r="13" fill="#0F766E" stroke="#F59E0B" stroke-width="1"/>
    <!-- Pentagons / Lines on ball -->
    <polygon points="24,15 28,18 26.5,23 21.5,23 20,18" fill="#F59E0B" opacity="0.95"/>
    <line x1="24" y1="15" x2="24" y2="10" stroke="#F59E0B" stroke-width="1" stroke-linecap="round"/>
    <line x1="28" y1="18" x2="33" y2="16" stroke="#F59E0B" stroke-width="1" stroke-linecap="round"/>
    <line x1="26.5" y1="23" x2="31" y2="28" stroke="#F59E0B" stroke-width="1" stroke-linecap="round"/>
    <line x1="21.5" y1="23" x2="17" y2="28" stroke="#F59E0B" stroke-width="1" stroke-linecap="round"/>
    <line x1="20" y1="18" x2="15" y2="16" stroke="#F59E0B" stroke-width="1" stroke-linecap="round"/>
    
    <!-- Bold 88 Numbers inside crest -->
    <text x="24" y="38" text-anchor="middle" font-family="'Rubik', 'Montserrat', sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" letter-spacing="1">88</text>
    
    <!-- Three Top Golden Stars -->
    <polygon points="24,2 25,4 27,4 25.5,5.5 26,7.5 24,6.2 22,7.5 22.5,5.5 21,4 23,4" fill="#F59E0B"/>
    <polygon points="17,3 17.7,4.5 19.3,4.5 18,5.7 18.5,7.2 17,6.2 15.5,7.2 16,5.7 14.7,4.5 16.3,4.5" fill="#F59E0B" transform="scale(0.8) translate(3, 0)"/>
    <polygon points="31,3 31.7,4.5 33.3,4.5 32,5.7 32.5,7.2 31,6.2 29.5,7.2 30,5.7 28.7,4.5 30.3,4.5" fill="#F59E0B" transform="scale(0.8) translate(7, 0)"/>
  </g>

  <!-- Typography Brand Section -->
  <g transform="translate(62, 10)">
    <!-- Primary Header: MINI SOCCER 88 -->
    <text x="0" y="17" font-family="'Rubik', 'Inter', sans-serif" font-weight="900" font-size="18" fill="#064E3B" letter-spacing="0.5">
      MINI SOCCER <tspan fill="#059669">88</tspan>
    </text>
    <!-- Sub Brand Badge Pill -->
    <rect x="0" y="23" width="94" height="15" rx="3" fill="#047857"/>
    <text x="47" y="34" text-anchor="middle" font-family="'Rubik', 'Inter', sans-serif" font-weight="800" font-size="9" fill="#FDE68A" letter-spacing="1">
      ALPHA SPORT
    </text>
    <!-- Venue Location Badge -->
    <text x="100" y="34" font-family="'Rubik', 'Inter', sans-serif" font-weight="700" font-size="9" fill="#6B7280" letter-spacing="0.5">
      PUSDIKIF CIMAHI
    </text>
  </g>

  <!-- Gradients and Defs -->
  <defs>
    <linearGradient id="crestGrad" x1="6" y1="2" x2="42" y2="47" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
    <filter id="dropShadow" x="0" y="0" width="50" height="56" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#042F2E" flood-opacity="0.35"/>
    </filter>
  </defs>
</svg>
